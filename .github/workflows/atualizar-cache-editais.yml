name: Atualizar cópia dos editais

# Salva uma cópia da lista pública de editais (editais-cache.json) junto com o site.
# Serve de reserva para quem abre o portal pela primeira vez se o banco estiver fora do ar.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar editais do banco
        env:
          SUPABASE_URL: https://cjtcfpiohhnvtqfktbsv.supabase.co
          SUPABASE_ANON_KEY: sb_publishable_nOfG7Stoy-0lO8CSeW-_EQ_QLvDoeGN
        run: |
          curl -fsS --retry 3 --max-time 60 \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/editais?select=*&order=criado_em.desc" -o editais-novo.json
          # só substitui se vier uma lista não vazia
          test "$(jq 'type=="array" and length>0' editais-novo.json)" = "true"
          jq -c '{data: .}' editais-novo.json > editais-corpo.json
          if [ -f editais-cache.json ] && [ "$(jq -c '.data' editais-cache.json)" = "$(jq -c '.data' editais-corpo.json)" ]; then
            echo "Sem mudanças."; rm -f editais-novo.json editais-corpo.json; exit 0
          fi
          jq -c --arg em "$(date -u +%FT%TZ)" '{em: $em, data: .data}' editais-corpo.json > editais-cache.json
          rm -f editais-novo.json editais-corpo.json
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editais-cache.json
          git diff --cached --quiet || (git commit -m "Atualiza cópia dos editais" && git push)
